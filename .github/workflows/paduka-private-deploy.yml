name: PADUKA private dashboard deploy (manual)

on:
  workflow_dispatch:
    inputs:
      deploy_now:
        description: "Deploy to Cloudflare Pages only after the Access verification succeeds."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paduka-private-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate deployment secrets
        env:
          ACCESS_GATE_CONFIRMED: ${{ secrets.PADUKA_ACCESS_PROTECTION_CONFIRMED }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          CF_ACCESS_APP_ID: ${{ secrets.CLOUDFLARE_ACCESS_APP_ID }}
          ACCESS_URL: ${{ secrets.PADUKA_ACCESS_URL }}
          OWNER_EMAIL: ${{ secrets.PADUKA_OWNER_EMAIL }}
        run: |
          test "$ACCESS_GATE_CONFIRMED" = "YES" || { echo "Deployment blocked: owner-only Cloudflare Access must be configured." >&2; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing Cloudflare API token." >&2; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing Cloudflare account ID." >&2; exit 1; }
          test -n "$CF_PROJECT_NAME" || { echo "Missing Cloudflare Pages project name." >&2; exit 1; }
          test -n "$CF_ACCESS_APP_ID" || { echo "Missing Cloudflare Access application ID." >&2; exit 1; }
          test -n "$ACCESS_URL" || { echo "Missing PADUKA Access URL." >&2; exit 1; }
          test -n "$OWNER_EMAIL" || { echo "Missing PADUKA owner email." >&2; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build dashboard into transient directory
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          mkdir -p build
          python -m mdv14 --feeds examples/feeds.sample.json \
            --output build/latest-report.json \
            --dashboard build/index.html \
            --economic-countries ID,US,CN
          test -s build/index.html
      - name: Verify Cloudflare Access owner-only policy before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_APP_ID: ${{ secrets.CLOUDFLARE_ACCESS_APP_ID }}
          PADUKA_ACCESS_URL: ${{ secrets.PADUKA_ACCESS_URL }}
          PADUKA_OWNER_EMAIL: ${{ secrets.PADUKA_OWNER_EMAIL }}
        run: python scripts/verify_cloudflare_access.py
      - name: Confirm preflight-only mode
        if: ${{ !inputs.deploy_now }}
        run: echo "Cloudflare Access verification passed. No deployment was requested."

      - name: Deploy behind verified Cloudflare Access
        if: ${{ inputs.deploy_now }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
