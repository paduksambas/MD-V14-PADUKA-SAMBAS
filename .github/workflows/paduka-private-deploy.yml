name: PADUKA private dashboard deploy (manual)

on:
  workflow_dispatch:
    inputs:
      deploy_now:
        description: "Deploy only after Access verification and alternate-hostname privacy checks."
        required: true
        type: boolean
        default: false
      alternate_hostnames_confirmed:
        description: "Confirm pages.dev and all preview URLs are disabled or separately protected by owner-only Access."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paduka-private-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate deployment secrets
        env:
          ACCESS_GATE_CONFIRMED: ${{ secrets.PADUKA_ACCESS_PROTECTION_CONFIRMED }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          CF_ACCESS_APP_ID: ${{ secrets.CLOUDFLARE_ACCESS_APP_ID }}
          ACCESS_URL: ${{ secrets.PADUKA_ACCESS_URL }}
          OWNER_EMAIL: ${{ secrets.PADUKA_OWNER_EMAIL }}
        run: |
          missing=()
          [[ -n "$ACCESS_GATE_CONFIRMED" ]] || missing+=("PADUKA_ACCESS_PROTECTION_CONFIRMED")
          [[ -n "$CF_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CF_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$CF_PROJECT_NAME" ]] || missing+=("CLOUDFLARE_PAGES_PROJECT")
          [[ -n "$CF_ACCESS_APP_ID" ]] || missing+=("CLOUDFLARE_ACCESS_APP_ID")
          [[ -n "$ACCESS_URL" ]] || missing+=("PADUKA_ACCESS_URL")
          [[ -n "$OWNER_EMAIL" ]] || missing+=("PADUKA_OWNER_EMAIL")
          if (( ${#missing[@]} > 0 )); then
            printf '::error title=Missing deployment secrets::Add these repository Actions secrets: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          if [[ "$ACCESS_GATE_CONFIRMED" != "YES" ]]; then
            echo "::error title=Cloudflare Access not confirmed::Set PADUKA_ACCESS_PROTECTION_CONFIRMED to the exact value YES only after configuring owner-only Access."
            exit 1
          fi
          if ! [[ "$CF_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]; then
            echo "Invalid Cloudflare Pages project name; expected 1-58 lowercase letters, digits, or hyphens." >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build dashboard into transient directory
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          rm -rf build
          mkdir -p build
          PRIVATE_REPORT="$(mktemp -t mdv14-private-report-XXXXXX.json)"
          trap 'rm -f "$PRIVATE_REPORT"' EXIT
          python -m mdv14 --feeds examples/feeds.sample.json \
            --output "$PRIVATE_REPORT" \
            --dashboard build/index.html \
            --economic-countries ID,US,CN
          test -s build/index.html
          test "$(find build -type f | wc -l)" -eq 1
          test "$(find build -type f ! -name 'index.html' | wc -l)" -eq 0
      - name: Verify Cloudflare Access owner-only policy before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_APP_ID: ${{ secrets.CLOUDFLARE_ACCESS_APP_ID }}
          PADUKA_ACCESS_URL: ${{ secrets.PADUKA_ACCESS_URL }}
          PADUKA_OWNER_EMAIL: ${{ secrets.PADUKA_OWNER_EMAIL }}
        run: python scripts/verify_cloudflare_access.py
      - name: Require alternate-hostname privacy confirmation before publishing
        if: ${{ inputs.deploy_now && !inputs.alternate_hostnames_confirmed }}
        run: |
          echo "::error title=Alternate hostnames not confirmed::Disable pages.dev and preview URLs or protect them with owner-only Cloudflare Access before deployment."
          exit 1
      - name: Confirm preflight-only mode
        if: ${{ !inputs.deploy_now }}
        run: |
          echo "Cloudflare Access verification passed for PADUKA_ACCESS_URL."
          echo "No deployment was requested."
          echo "Before deploying, ensure the project's pages.dev and preview URLs are disabled or separately protected by owner-only Access."

      - name: Deploy behind verified Cloudflare Access
        if: ${{ inputs.deploy_now && inputs.alternate_hostnames_confirmed }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
