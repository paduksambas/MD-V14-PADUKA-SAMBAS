name: Scheduled global intelligence monitoring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitoring.yml'
      - 'examples/feeds.sample.json'
      - 'mdv14/knowledge_graph.py'
      - 'mdv14/analyst_report.py'
      - 'mdv14/command_center.py'
      - 'mdv14/country_explorer.py'
      - 'mdv14/economic_intelligence.py'
      - 'mdv14/economic_data.py'
      - 'mdv14/indonesia_intelligence.py'
      - 'mdv14/regional_intelligence.py'
      - 'tests/test_regional_intelligence.py'
      - 'docs/BUILD-3.9-INDONESIA-REGIONAL-INTELLIGENCE.md'
      - 'examples/regional-data.sample.json'
      - 'examples/bps-regional-tables.sample.json'
      - 'examples/bps-regional-tables.json'
      - 'examples/bps-public-export.sample.json'
      - 'examples/bps-public-export.json'
      - 'docs/BUILD-4.1-BPS-PUBLIC-EXPORT-IMPORT.md'
      - 'docs/BUILD-4.0-BPS-REGIONAL-TABLE-CONNECTOR.md'
      - 'docs/BUILD-3.8-INDONESIA-STRATEGIC-ECONOMIC-INTELLIGENCE.md'
      - 'tests/test_indonesia_intelligence.py'
      - 'mdv14/market_data.py'
      - 'mdv14/market_analytics.py'
      - 'mdv14/public_assets.py'
      - 'mdv14/commodity_data.py'
      - 'tests/test_commodity_data.py'
      - 'tests/test_public_assets.py'
      - 'tests/test_market_analytics.py'
      - 'tests/test_market_data.py'
      - 'mdv14/__main__.py'
      - 'tests/test_economic_data.py'
      - 'mdv14/dashboard.py'
      - 'mdv14/pipeline.py'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mdv14-global-monitoring
  cancel-in-progress: false

jobs:
  collect-with-private-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Discover official BPS Sambas indicator metadata
        if: always()
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.parse, urllib.request
          key = os.environ.get("BPS_API_KEY", "").strip()
          print("\\n## BPS Sambas metadata discovery")
          if not key:
              print("- Status: BLOCKED — BPS_API_KEY secret unavailable")
              raise SystemExit(0)
          base = "https://webapi.bps.go.id/v1/api"
          def get(path):
              req = urllib.request.Request(base + path, headers={"Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read(3000000).decode("utf-8"))
          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj, list):
                  for v in obj: yield from walk(v)
          try:
              catalog = get("/domain/type/kab/key/" + urllib.parse.quote(key, safe=""))
              candidates = []
              for row in walk(catalog):
                  if not isinstance(row, dict): continue
                  name = str(row.get("domain_name", row.get("name", row.get("nama", ""))))
                  if "sambas" in name.lower():
                      did = row.get("domain_id", row.get("domain", row.get("id", row.get("kode"))))
                      if did is not None: candidates.append((str(did), name))
              if not candidates:
                  print("- Sambas domain: not identified in catalog response")
                  raise SystemExit(0)
              domain, name = candidates[0]
              print("- Sambas domain: discovered (catalog name: " + name + ")")
              data = get("/list/model/var/domain/" + urllib.parse.quote(domain, safe="") + "/key/" + urllib.parse.quote(key, safe=""))
              variables = []
              for row in walk(data):
                  if not isinstance(row, dict): continue
                  vid = row.get("var_id", row.get("id"))
                  title = row.get("title", row.get("var_name", row.get("label")))
                  if vid is not None and title:
                      variables.append((str(vid), str(title), str(row.get("unit", ""))))
              terms = ("penduduk", "populasi", "kemiskinan", "pengangguran", "tenaga kerja", "pdrb", "pertumbuhan ekonomi", "pertanian")
              matches = [v for v in variables if any(t in v[1].lower() for t in terms)]
              print("- Variable metadata records: " + str(len(variables)))
              print("- Indicator candidates:")
              for vid, title, unit in matches[:30]:
                  print("- " + title + " | variable ID " + vid + " | unit " + unit)
              if not matches: print("- No matching indicator labels; review metadata.")
          except SystemExit:
              raise
          except Exception as exc:
              print("- Discovery ERROR: " + type(exc).__name__ + " (details suppressed)")
          PY
      - name: Run RSS/Atom monitoring cycle
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          python -m mdv14 --feeds examples/feeds.sample.json \
            --database build/mdv14-history.sqlite3 \
            --output build/latest-report.json \
            --dashboard build/monitoring-dashboard.html \
            --economic-countries ID,US,CN \
            --economic-start-year 2020 \
            $(if [ -f examples/bps-regional-tables.json ]; then printf '%s' '--bps-tables-config examples/bps-regional-tables.json'; fi) \
            >/dev/null
      - name: Publish privacy-safe provider status
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("build/latest-report.json")
          print("\n## Data-provider health (safe aggregate)")
          if not path.exists():
              print("- Report: not generated")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              bps = report.get("regional_intelligence", {}).get("bps_region_catalog", {})
              tables = report.get("bps_regional_tables", {})
              fred = report.get("fred_market_data", {})
              print("- BPS catalog: {} | domains: {}".format(bps.get("status", "unknown"), bps.get("region_count", 0)))
              print("- BPS tables: {} | requests: {} | observations: {} | failed: {}".format(tables.get("status", "unknown"), tables.get("request_count", 0), len(tables.get("observations", [])), tables.get("requests_failed", 0)))
              print("- FRED: {} | requests: {} | succeeded: {} | failed: {} | observations: {}".format(fred.get("status", "unknown"), fred.get("request_count", 0), fred.get("requests_succeeded", 0), fred.get("requests_failed", 0), fred.get("observation_count", 0)))
              print("\n## Build 1.9 live-data readiness")
              print("- FRED live observations: {}".format("PASS" if fred.get("observation_count", 0) > 0 and fred.get("requests_succeeded", 0) > 0 else "PENDING"))
              print("- BPS live table observations: {}".format("PASS" if len(tables.get("observations", [])) > 0 else "PENDING"))
              print("- Next stage readiness: {}".format("READY" if fred.get("observation_count", 0) > 0 and len(tables.get("observations", [])) > 0 else "BLOCKED"))
              print("- No API keys, raw data, reports, dashboards, or databases are published.")
          PY
      - name: Add privacy-safe workflow summary
        if: always()
        run: |
          {
            echo "# MD V14 scheduled run"
            echo "- Workflow execution completed; only aggregate provider-health metrics (status and counts) are published above. Detailed reports, raw observations, dashboards, and SQLite history remain private and are not uploaded."
            echo "- Reports and dashboards remain transient on the runner and are not uploaded as artifacts."
            echo "- No persistent trend-history cache is created by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      # Public-repository privacy guard:
      # - never upload reports, dashboards, or SQLite history;
      # - do not persist generated trend history in Actions cache;
      # - suppress routine CLI metrics from public workflow logs.
