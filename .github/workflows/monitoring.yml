name: Scheduled global intelligence monitoring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitoring.yml'
      - 'examples/feeds.sample.json'
      - 'mdv14/knowledge_graph.py'
      - 'mdv14/analyst_report.py'
      - 'mdv14/command_center.py'
      - 'mdv14/country_explorer.py'
      - 'mdv14/economic_intelligence.py'
      - 'mdv14/economic_data.py'
      - 'mdv14/indonesia_intelligence.py'
      - 'mdv14/regional_intelligence.py'
      - 'tests/test_regional_intelligence.py'
      - 'docs/BUILD-3.9-INDONESIA-REGIONAL-INTELLIGENCE.md'
      - 'examples/regional-data.sample.json'
      - 'examples/bps-regional-tables.sample.json'
      - 'examples/bps-regional-tables.json'
      - 'examples/bps-public-export.sample.json'
      - 'examples/bps-public-export.json'
      - 'docs/BUILD-4.1-BPS-PUBLIC-EXPORT-IMPORT.md'
      - 'docs/BUILD-4.0-BPS-REGIONAL-TABLE-CONNECTOR.md'
      - 'docs/BUILD-3.8-INDONESIA-STRATEGIC-ECONOMIC-INTELLIGENCE.md'
      - 'tests/test_indonesia_intelligence.py'
      - 'mdv14/market_data.py'
      - 'mdv14/market_analytics.py'
      - 'mdv14/public_assets.py'
      - 'mdv14/commodity_data.py'
      - 'tests/test_commodity_data.py'
      - 'tests/test_public_assets.py'
      - 'tests/test_market_analytics.py'
      - 'tests/test_market_data.py'
      - 'mdv14/__main__.py'
      - 'tests/test_economic_data.py'
      - 'mdv14/dashboard.py'
      - 'mdv14/pipeline.py'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mdv14-global-monitoring
  cancel-in-progress: false

jobs:
  collect-with-private-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Discover official BPS Sambas indicator metadata
        if: always()
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.parse, urllib.request
          print("\\n## BPS Sambas metadata discovery")
          key = os.environ.get("BPS_API_KEY", "").strip()
          if not key:
              print("- Discovery status: BLOCKED (BPS_API_KEY secret is not configured)")
              raise SystemExit(0)
          base = "https://webapi.bps.go.id/v1/api"
          def get(path):
              req = urllib.request.Request(base + path, headers={"Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read(3000000).decode("utf-8"))
          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)
          try:
              catalog = get("/domain/type/kab/key/" + urllib.parse.quote(key, safe=""))
              matches = []
              for row in walk(catalog):
                  if not isinstance(row, dict): continue
                  name = row.get("domain_name") or row.get("name") or row.get("nama")
                  domain_id = row.get("domain_id") or row.get("domain") or row.get("id") or row.get("kode")
                  if name and domain_id and "sambas" in str(name).lower():
                      matches.append((str(domain_id), str(name)))
              matches = list(dict.fromkeys(matches))
              if not matches:
                  print("- Discovery status: NO_MATCH (catalog retrieved; Sambas domain not parsed/found)")
                  raise SystemExit(0)
              if len(matches) > 1:
                  print("- Discovery status: AMBIGUOUS (multiple Sambas catalog entries)")
                  for domain_id, name in matches[:5]:
                      print("- Candidate domain: " + name + " | ID " + domain_id)
                  raise SystemExit(0)
              domain_id, domain_name = matches[0]
              print("- Discovery status: DOMAIN_FOUND")
              print("- Official catalog domain: " + domain_name + " | ID " + domain_id)
              metadata = get("/list/model/var/domain/" + urllib.parse.quote(domain_id, safe="") + "/key/" + urllib.parse.quote(key, safe=""))
              variables = []
              for row in walk(metadata):
                  if not isinstance(row, dict): continue
                  var_id = row.get("var_id") or row.get("variable_id")
                  title = row.get("title") or row.get("var_name") or row.get("label") or row.get("name")
                  if var_id is not None and title:
                      variables.append((str(var_id), str(title), str(row.get("unit") or row.get("var_unit") or "")))
              variables = list(dict.fromkeys(variables))
              terms = ("penduduk", "populasi", "kemiskinan", "pengangguran", "tenaga kerja", "pdrb", "pertumbuhan ekonomi", "pertanian")
              candidates = [item for item in variables if any(term in item[1].lower() for term in terms)]
              print("- Parsed variable records: " + str(len(variables)))
              print("- Candidate indicators found: " + str(len(candidates)))
              for var_id, title, unit in candidates[:25]:
                  print("- " + title + " | variable ID " + var_id + " | unit " + unit)
              print("\\n## BPS Sambas period metadata")
              for var_id, title, unit in candidates[:10]:
                  try:
                      period_payload = get("/list/model/th/domain/" + urllib.parse.quote(domain_id, safe="") + "/var/" + urllib.parse.quote(var_id, safe="") + "/key/" + urllib.parse.quote(key, safe=""))
                      found_periods = []
                      for row in walk(period_payload):
                          if not isinstance(row, dict):
                              continue
                          period_id = row.get("th_id") or row.get("period_id") or row.get("id")
                          period_name = row.get("th_name") or row.get("period_name") or row.get("title") or row.get("name")
                          if period_id is not None and period_name is not None:
                              found_periods.append((str(period_id), str(period_name)))
                      found_periods = list(dict.fromkeys(found_periods))
                      if found_periods:
                          for period_id, period_name in found_periods[:8]:
                              print("- " + title + " | period " + period_name + " | period ID " + period_id)
                      else:
                          response_keys = sorted(str(item) for item in period_payload.keys())[:20] if isinstance(period_payload, dict) else []
                          response_status = str(period_payload.get("status") or period_payload.get("status_code") or "unknown") if isinstance(period_payload, dict) else "unknown"
                          response_message = str(period_payload.get("message") or period_payload.get("error") or "").replace(key, "[REDACTED]")[:160] if isinstance(period_payload, dict) else ""
                          data_block = period_payload.get("data") if isinstance(period_payload, dict) else None
                          data_keys = sorted(str(item) for item in data_block[0].keys())[:20] if isinstance(data_block, list) and data_block and isinstance(data_block[0], dict) else []
                          sample_rows = data_block[1] if isinstance(data_block, list) and len(data_block) > 1 and isinstance(data_block[1], list) else []
                          sample_keys = sorted(str(item) for item in sample_rows[0].keys())[:30] if sample_rows and isinstance(sample_rows[0], dict) else []
                          safe_fields = ("th_id", "period_id", "id", "th", "name", "title", "label", "year", "period", "tahun", "id_tahun", "period_name", "th_name")
                          sample_fields = {str(k): str(v)[:80] for k, v in sample_rows[0].items() if str(k).lower() in safe_fields} if sample_rows and isinstance(sample_rows[0], dict) else {}
                          print("- " + title + " | period metadata not parsed; status " + response_status + " | response keys " + ",".join(response_keys) + " | data keys " + ",".join(data_keys) + " | row keys " + ",".join(sample_keys) + " | sample fields " + json.dumps(sample_fields, ensure_ascii=False) + " | message " + response_message)
                  except Exception as period_exc:
                      print("- " + title + " | period lookup unavailable (" + type(period_exc).__name__ + ")")
              if not variables:
                  print("- Discovery status: METADATA_EMPTY (domain confirmed, variable response not parsed)")
              elif candidates:
                  print("- Discovery status: METADATA_FOUND (candidate labels require period/table validation)")
              else:
                  print("- Discovery status: NO_INDICATOR_MATCH (metadata parsed; review indicator terms)")
          except SystemExit:
              raise
          except Exception as exc:
              print("- Discovery status: API_ERROR (" + type(exc).__name__ + "; details suppressed)")
          PY
      - name: Run RSS/Atom monitoring cycle
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          python -m mdv14 --feeds examples/feeds.sample.json \
            --database build/mdv14-history.sqlite3 \
            --output build/latest-report.json \
            --dashboard build/monitoring-dashboard.html \
            --economic-countries ID,US,CN \
            --economic-start-year 2020 \
            $(if [ -f examples/bps-regional-tables.json ]; then printf '%s' '--bps-tables-config examples/bps-regional-tables.json'; fi) \
            >/dev/null
      - name: Publish privacy-safe provider status
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("build/latest-report.json")
          print("\n## Data-provider health (safe aggregate)")
          if not path.exists():
              print("- Report: not generated")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              bps = report.get("regional_intelligence", {}).get("bps_region_catalog", {})
              tables = report.get("bps_regional_tables", {})
              fred = report.get("fred_market_data", {})
              world_bank = report.get("economic_data", {})
              print("- BPS catalog: {} | domains: {}".format(bps.get("status", "unknown"), bps.get("region_count", 0)))
              print("- BPS tables: {} | requests: {} | observations: {} | failed: {}".format(tables.get("status", "unknown"), tables.get("request_count", 0), len(tables.get("observations", [])), tables.get("requests_failed", 0)))
              print("- FRED: {} | requests: {} | succeeded: {} | failed: {} | observations: {}".format(fred.get("status", "unknown"), fred.get("request_count", 0), fred.get("requests_succeeded", 0), fred.get("requests_failed", 0), fred.get("observation_count", 0)))
              print("- World Bank: {} | requests: {} | succeeded: {} | failed: {} | observations: {}".format(world_bank.get("status", "unknown"), world_bank.get("request_count", 0), world_bank.get("requests_succeeded", 0), world_bank.get("requests_failed", 0), world_bank.get("observation_count", 0)))
              print("\n## Build 1.9 live-data readiness")
              print("- FRED live observations: {}".format("PASS" if fred.get("observation_count", 0) > 0 and fred.get("requests_succeeded", 0) > 0 else "PENDING"))
              print("- BPS live table observations: {}".format("PASS" if len(tables.get("observations", [])) > 0 else "PENDING"))
              print("- Next stage readiness: {}".format("READY" if fred.get("observation_count", 0) > 0 and len(tables.get("observations", [])) > 0 else "BLOCKED"))
              print("- No API keys, raw data, reports, dashboards, or databases are published.")
          PY
      - name: Add privacy-safe workflow summary
        if: always()
        run: |
          {
            echo "# MD V14 scheduled run"
            echo "- Workflow execution completed; only aggregate provider-health metrics (status and counts) are published above. Detailed reports, raw observations, dashboards, and SQLite history remain private and are not uploaded."
            echo "- Reports and dashboards remain transient on the runner and are not uploaded as artifacts."
            echo "- No persistent trend-history cache is created by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      # Public-repository privacy guard:
      # - never upload reports, dashboards, or SQLite history;
      # - do not persist generated trend history in Actions cache;
      # - suppress routine CLI metrics from public workflow logs.
