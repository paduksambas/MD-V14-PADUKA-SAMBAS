name: Deploy PADUKA public dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_public_dashboard.sh'
      - 'scripts/airtable_bps.py'
      - 'mdv14/**'
      - 'examples/feeds.sample.json'
      - 'examples/airtable-bps-dashboard.json'
      - 'examples/bps-public-export.json'
      - 'data/bps-public-export.csv'
      - 'data/bps-public-export.xlsx'
      - 'data/bps-public-export.json'
      - 'data/README.md'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
  # Rebuild the dashboard after the six-hourly BPS → Airtable monitoring cycle.
  workflow_run:
    workflows: ["Scheduled global intelligence monitoring"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build public dashboard
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: bash scripts/build_public_dashboard.sh
      - name: Verify public artifact
        run: |
          test -s public/index.html
          test "$(find public -type f | wc -l)" -eq 1
          test "$(find public -type f -name '*.json' | wc -l)" -eq 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
