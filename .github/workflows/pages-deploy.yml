name: Deploy PADUKA public dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_public_dashboard.sh'
      - 'mdv14/**'
      - 'examples/feeds.sample.json'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build public dashboard
        run: bash scripts/build_public_dashboard.sh
      - name: Verify public artifact
        run: |
          test -s public/index.html
          test "$(find public -type f | wc -l)" -eq 1
          test "$(find public -type f -name '*.json' | wc -l)" -eq 0
      - name: Verify Pages administration credential
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error title=Missing PAGES_TOKEN::Add a repository Actions secret named PAGES_TOKEN. It must be a fine-grained PAT for this repository with Administration: write, Pages: write, and Contents: read."
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
